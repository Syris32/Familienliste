.b{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}.b h3{margin:0;font-size:.98rem}.n{font-size:.88rem;color:var(--mu);background:var(--bg);padding:8px;border-radius:8px}
.by{color:var(--ok);font-weight:600;font-size:.9rem}.sp{flex:1}
